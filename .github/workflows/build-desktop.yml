name: Build Desktop App

# Baut die Desktop-App für macOS und Windows über PyInstaller (siehe desktop/README.md).
# Windows wird ausschließlich hier gebaut — kein lokaler Windows-Rechner im Projekt vorhanden.
# Läuft bei Push auf main (wenn sich desktop/, backend/ oder frontend/ geändert haben) oder bei
# Push eines "v*"-Tags. Bei einem Tag-Push (oder manuell über workflow_dispatch mit release_tag)
# werden die gebauten Apps zusätzlich als .zip an den passenden GitHub Release angehängt.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: >-
          Bestehender Release-Tag, dem die Build-Artefakte nachträglich angehängt werden sollen
          (z. B. v1.0.0). Leer lassen für einen normalen Build ohne Release-Upload.
        required: false
        type: string
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "desktop/**"
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/build-desktop.yml"

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python-Abhängigkeiten installieren
        run: pip install -r backend/requirements-dev.txt

      - name: Backend-Tests (pytest)
        working-directory: backend
        run: python -m pytest tests/ -v

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend-Production-Build
        working-directory: frontend
        run: |
          npm install
          npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python-Abhängigkeiten installieren
        run: |
          pip install -r backend/requirements.txt
          pip install -r desktop/requirements.txt

      - name: App bauen (PyInstaller)
        working-directory: desktop
        run: python -m PyInstaller --noconfirm nk-tool.spec

      - name: App-Bundle packen
        # WICHTIG: als tar.gz packen statt den rohen .app-Ordner hochzuladen — GitHub-Actions-
        # Artifacts (upload-artifact/download-artifact) bewahren Unix-Exec-Rechte bei losen
        # Dateien nicht zuverlässig (reproduzierter Bug: Contents/MacOS/NK-Tool kam beim
        # Download ohne +x an, App ließ sich nicht mehr starten). tar bewahrt Rechte immer.
        working-directory: desktop
        run: tar -czf NK-Tool-macOS.tar.gz -C dist NK-Tool.app

      - name: Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: NK-Tool-macOS
          path: desktop/NK-Tool-macOS.tar.gz
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend-Production-Build
        working-directory: frontend
        run: |
          npm install
          npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python-Abhängigkeiten installieren
        run: |
          pip install -r backend/requirements.txt
          pip install -r desktop/requirements.txt

      - name: App bauen (PyInstaller)
        working-directory: desktop
        run: python -m PyInstaller --noconfirm nk-tool-windows.spec

      - name: App-Ordner packen
        working-directory: desktop
        run: Compress-Archive -Path dist/NK-Tool -DestinationPath NK-Tool-Windows.zip

      - name: Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: NK-Tool-Windows
          path: desktop/NK-Tool-Windows.zip
          if-no-files-found: error

  release:
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    # Nur bei Tag-Push (refs/tags/v...) oder manuellem Trigger mit gesetztem release_tag-Input.
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.release_tag != ''
    permissions:
      contents: write
    steps:
      # Beide Build-Jobs laden bereits fertig gepackte Archive hoch (tar.gz/zip) — hier nur
      # herunterladen und direkt an den Release anhängen, kein erneutes Packen nötig (das war
      # zuvor die Ursache für verlorene Exec-Rechte im macOS-Bundle, siehe build-macos-Job).
      - name: Artefakte herunterladen
        uses: actions/download-artifact@v4
        with:
          pattern: NK-Tool-*
          path: dist
          merge-multiple: true

      - name: Zieltag bestimmen
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.release_tag }}" ]; then
            echo "tag=${{ github.event.inputs.release_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Assets an Release anhängen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist/
          gh release upload "${{ steps.tag.outputs.tag }}" \
            dist/NK-Tool-macOS.tar.gz dist/NK-Tool-Windows.zip \
            --repo "${{ github.repository }}" --clobber
