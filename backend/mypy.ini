; Static typing for the NK-Tool backend (GOAL.md 3.3).
; Pragmatic strictness: full function-signature coverage without fighting the
; classic (non-Mapped) SQLAlchemy declarative style used in models.py.

[mypy]
python_version = 3.12
files = .
exclude = (?x)(^tests/ | ^backup_safe/)

check_untyped_defs = True
disallow_untyped_defs = True
disallow_incomplete_defs = True
no_implicit_optional = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_return_any = False
ignore_missing_imports = True

; Classic Column()-style models: attribute access is typed as Any by design.
disallow_any_explicit = False
