<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <rect width="128" height="128" rx="26" fill="#f8fafc"/>
  <!-- Aufteilungs-Kreis: symbolisiert die Kernfunktion "Nebenkosten aufteilen" -->
  <g transform="translate(64,64)">
    <!-- Segment 1: gross (grosser Anteil) -->
    <path d="M0,0 L0,-46 A46,46 0 0 1 39.8,23 Z" fill="#1e3a8a"/>
    <!-- Segment 2: mittel -->
    <path d="M0,0 L39.8,23 A46,46 0 0 1 -39.8,23 Z" fill="#2563eb"/>
    <!-- Segment 3: klein -->
    <path d="M0,0 L-39.8,23 A46,46 0 0 1 0,-46 Z" fill="#93c5fd"/>
    <circle r="17" fill="#f8fafc"/>
  </g>
</svg>
