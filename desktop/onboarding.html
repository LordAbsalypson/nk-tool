<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<title>NK-Tool — Einrichtung</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
    background: #f4f4f5; color: #18181b;
    display: flex; align-items: center; justify-content: center;
  }
  @media (prefers-color-scheme: dark) {
    html, body { background: #18181b; color: #f4f4f5; }
    .card { background: #27272a !important; border-color: #3f3f46 !important; }
    .btn-secondary { background: transparent !important; color: #e4e4e7 !important; border-color: #52525b !important; }
  }
  .card {
    width: 440px; padding: 32px; background: #ffffff; border: 1px solid #e4e4e7;
    border-radius: 14px; box-shadow: 0 8px 30px rgba(0,0,0,0.08);
  }
  h1 { font-size: 17px; font-weight: 600; margin: 0 0 6px; }
  p.sub { font-size: 13px; color: #71717a; margin: 0 0 24px; line-height: 1.5; }
  button {
    width: 100%; padding: 11px 16px; border-radius: 9px; font-size: 14px; font-weight: 500;
    cursor: pointer; margin-bottom: 10px; border: 1px solid transparent;
  }
  .btn-primary { background: #2563eb; color: #fff; }
  .btn-primary:hover { background: #1d4ed8; }
  .btn-secondary { background: #fff; color: #18181b; border-color: #d4d4d8; }
  .btn-secondary:hover { background: #f4f4f5; }
  .error {
    display: none; margin-top: 14px; padding: 10px 12px; border-radius: 8px;
    background: #fef2f2; color: #991b1b; font-size: 12.5px; line-height: 1.4;
  }
  .busy { opacity: 0.6; pointer-events: none; }
</style>
</head>
<body>
  <div class="card" id="card">
    <h1>NK-Tool einrichten</h1>
    <p class="sub">Erster Start auf diesem Rechner. Standardmäßig wird eine neue,
      leere Datenbank angelegt — oder eine bestehende importieren.</p>
    <button class="btn-primary" id="btn-new">Neue Datenbank anlegen</button>
    <button class="btn-secondary" id="btn-import">Bestehende Datenbank importieren …</button>
    <div class="error" id="error"></div>
  </div>
  <script>
    const card = document.getElementById("card");
    const errorBox = document.getElementById("error");

    function showError(msg) {
      errorBox.textContent = msg;
      errorBox.style.display = "block";
    }

    function ready(fn) {
      if (window.pywebview) fn();
      else window.addEventListener("pywebviewready", fn);
    }

    ready(() => {
      document.getElementById("btn-new").addEventListener("click", async () => {
        card.classList.add("busy");
        await window.pywebview.api.create_new();
      });

      document.getElementById("btn-import").addEventListener("click", async () => {
        errorBox.style.display = "none";
        card.classList.add("busy");
        const res = await window.pywebview.api.choose_and_import();
        card.classList.remove("busy");
        if (!res.ok && res.error) showError(res.error);
        // res.ok === false && res.error === null -> Dateiauswahl abgebrochen, nichts tun
      });
    });
  </script>
</body>
</html>
